<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - 页面未找到</title>
</head>
<body>
  <script>
    var path = window.location.pathname;
    window.location.href = '/?redirect=' + encodeURIComponent(path);
  </script>
</body>
